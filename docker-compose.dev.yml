# ============================================================
# Development Docker Compose - Hytale Server Only
# ============================================================

services:
  hytale:
    build: .
    container_name: ${STACK_NAME:-hytale}-dev
    hostname: ${STACK_NAME:-hytale}-dev
    restart: unless-stopped
    
    environment:
      # Debug: Current working directory (where docker-compose was run from)
      - PWD=${PWD}
      
      # Java / RAM
      - JAVA_MIN_RAM=${JAVA_MIN_RAM:-3G}
      - JAVA_MAX_RAM=${JAVA_MAX_RAM:-4G}
      
      # Server
      - SERVER_PORT=${SERVER_PORT:-5520}
      - SERVER_BIND=0.0.0.0
      - TZ=${TZ:-Europe/Berlin}
      
      # Backups (built-in backup disabled by default)
      - ENABLE_BACKUP=${ENABLE_BACKUP:-false}
      - BACKUP_FREQUENCY=${BACKUP_FREQUENCY:-30}
      
      # Auth
      - AUTH_MODE=${AUTH_MODE:-}

      # Game data path: where manager sees game files (same volume as game container)
      - GAME_SERVER_DATA_PATH=${GAME_SERVER_DATA_PATH:-/opt/hytale/server}
      # Manager data path (volume mount point)
      - MANAGER_DATA_PATH=${MANAGER_DATA_PATH:-/app/data}

      # EasyWebMap (optional)
      - WEBMAP_PORT=${WEBMAP_PORT:-18081}
      - WEBMAP_WS_PORT=${WEBMAP_WS_PORT:-18082}

    # Ports - UDP for game, TCP for webmap and plugin API
    ports:
      - "${SERVER_PORT:-5520}:${SERVER_PORT:-5520}/udp"
      - "${WEBMAP_PORT:-18081}:${WEBMAP_PORT:-18081}/tcp"
      - "${WEBMAP_WS_PORT:-18082}:${WEBMAP_WS_PORT:-18082}/tcp"
      # Plugin API port (exposed for local backend connection)
      - "18085:18085/tcp"
    
    # Volumes - Bind mount (host folder). Use a named volume to avoid anonymous volume IDs.
    # Named: replace the line below with "hytale-dev-server-data:/opt/hytale/server" and uncomment the volumes section at the bottom.
    volumes:
      - type: bind
        source: ${GAME_SERVER_DATA_PATH:-hytale-server}
        target: /opt/hytale/server

    # Console
    stdin_open: true
    tty: true
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    # Network - use bridge network so container name is accessible from host
    # The container name (hytale-dev) will be resolvable from the host
    # Backend (running locally) can:
    #   - Connect to plugin API: http://localhost:18085 (port exposed to host)
    #   - Use Docker API to manage container (via Docker socket)
    #   - Access files via Docker API (docker exec, docker cp)
    networks:
      - dev-net

    # SECURITY: Resource limits
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_CPU_LIMIT:-4}'
          memory: ${DOCKER_MEMORY_LIMIT:-8G}
        reservations:
          cpus: '1'
          memory: ${JAVA_MAX_RAM:-4G}

    # SECURITY: Prevent privilege escalation
    security_opt:
      - no-new-privileges:true

    # SECURITY: Drop unnecessary capabilities
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - NET_BIND_SERVICE

# ============================================================
# Networks
# ============================================================
networks:
  dev-net:
    name: ${STACK_NAME:-hytale}-dev-net
    driver: bridge

# ============================================================
# Named volume (optional - use instead of bind mount to avoid anonymous volume IDs)
# Uncomment "hytale-dev-server-data" in service volumes and comment the bind mount line
# ============================================================
# volumes:
#   hytale-dev-server-data:
